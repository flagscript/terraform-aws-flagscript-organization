commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --config .config/.commitlintrc.yaml --edit $1

pre-commit:
  parallel: true
  jobs:
    - name: terraform-fmt
      glob:
        - "*.tf"
        - "**/*.tf"
      run: terraform fmt -recursive
      stage_fixed: true
    # Only rewrites between the BEGIN_TF_DOCS/END_TF_DOCS markers; see .terraform-docs.yml
    # Regenerates the root README (with docs/header.md + docs/footer.md) and examples/*/README.md,
    # then each submodule's README from its own modules/*/.terraform-docs.yml.
    - name: terraform-docs
      glob:
        - "*.tf"
        - "**/*.tf"
        - "docs/*.md"
        - "modules/*/docs/*.md"
        - "**/.terraform-docs.yml"
        - ".terraform-docs.yml"
      run: terraform-docs . && for d in modules/*/; do terraform-docs "$d"; done && git add README.md examples/*/README.md modules/*/README.md
    # - name: terraform-tflint
    #   glob:
    #     - "*.tf"
    #     - "**/*.tf"
    #   run: tflint --config .config/.tflint.hcl --init && tflint --config .config/.tflint.hcl --format=junit > reports/tflint-junit.xml
    #   depends_on:
