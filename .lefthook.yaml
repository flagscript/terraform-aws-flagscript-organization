commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --config .config/.commitlintrc.yaml --edit $1

pre-commit:
  parallel: true
  jobs:
    - name: terraform-fmt
      glob:
        - "*.tf"
        - "**/*.tf"
      run: terraform fmt -recursive
      stage_fixed: true
