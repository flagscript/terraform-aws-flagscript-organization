# Regenerate with: terraform-docs .
formatter: markdown table

recursive:
  enabled: true
  path: modules
  include-main: true

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  hide-empty: false
  html: true
  indent: 2
  required: true
  type: true
