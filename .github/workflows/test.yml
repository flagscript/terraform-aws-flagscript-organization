name: Module tests
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read # default for all jobs

jobs:
  test-modules:
    name: Test terraform modules
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags, create GitHub releases
      issues: write # comment on/label released issues
      pull-requests: write # comment on released PRs
      id-token: write # only if using npm provenance / trusted publishing
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check
        continue-on-error: false
