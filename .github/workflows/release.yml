name: release
on:
  push:
    branches:
      - main
permissions:
  contents: read # default for all jobs

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags, create GitHub releases
      issues: write # comment on/label released issues
      pull-requests: write # comment on released PRs
      id-token: write # only if using npm provenance / trusted publishing
    environment:
      name: release #your environment name
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
